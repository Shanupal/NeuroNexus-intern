<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <link rel="stylesheet" href="/styles/variables.css">
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/form.css">
    <link rel="stylesheet" href="/styles/animations.css">
    <link rel="stylesheet" href="/styles/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <div class="form-container">
        <header class="form-header">
          <div class="form-title">
            <h1>Contact Information</h1>
            <p>Please fill out this form to get in touch with us</p>
          </div>
          <div class="form-brand">
            <div class="brand-dot" style="background-color: var(--color-blue);"></div>
            <div class="brand-dot" style="background-color: var(--color-red);"></div>
            <div class="brand-dot" style="background-color: var(--color-yellow);"></div>
            <div class="brand-dot" style="background-color: var(--color-green);"></div>
          </div>
        </header>
        
        <form id="contactForm">
          <div class="form-section">
            <div class="form-field">
              <label for="fullName">Full Name <span class="required">*</span></label>
              <input type="text" id="fullName" name="fullName" required>
            </div>
            
            <div class="form-field">
              <label for="contactNumber">Contact Number <span class="required">*</span></label>
              <input type="tel" id="contactNumber" name="contactNumber" required>
            </div>
            
            <div class="form-field">
              <label for="email">Email Address <span class="required">*</span></label>
              <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-field">
              <label for="companyName">Company Name</label>
              <input type="text" id="companyName" name="companyName">
            </div>
            
            <div class="form-field">
              <label for="department">Department <span class="required">*</span></label>
              <div class="select-wrapper">
                <select id="department" name="department" required>
                  <option value="" disabled selected>Select a department</option>
                  <option value="hr">HR</option>
                  <option value="sales">Sales</option>
                  <option value="development">Development</option>
                  <option value="marketing">Marketing</option>
                  <option value="others">Others</option>
                </select>
              </div>
            </div>
            
            <div class="form-field">
              <label for="address">Address</label>
              <textarea id="address" name="address" rows="3"></textarea>
            </div>
            
            <div class="form-field">
              <label class="radio-group-label">Gender</label>
              <div class="radio-group">
                <div class="radio-option">
                  <input type="radio" id="male" name="gender" value="male">
                  <label for="male">Male</label>
                </div>
                <div class="radio-option">
                  <input type="radio" id="female" name="gender" value="female">
                  <label for="female">Female</label>
                </div>
                <div class="radio-option">
                  <input type="radio" id="preferNotToSay" name="gender" value="preferNotToSay">
                  <label for="preferNotToSay">Prefer not to say</label>
                </div>
              </div>
            </div>
          </div>
          
          <div class="form-actions">
            <button type="submit" class="submit-button">Submit</button>
          </div>
        </form>
        
        <footer class="form-footer">
          <p>Your information is securely processed and stored</p>
        </footer>
      </div>
    </div>
  </body>
</html>
